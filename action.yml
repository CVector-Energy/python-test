name: CVector Python Test
description: Setup UV and run ruff, mypy, and pytest for Python projects

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.14"
  uv-version:
    description: UV version to install
    required: false
    default: "0.11.2"
  src-dirs:
    description: Source directories for linting (space-separated)
    required: false
    default: "."
  working-directory:
    description: Directory containing pyproject.toml (defaults to repo root)
    required: false
    default: "."
  run-pytest:
    description: Whether to run pytest
    required: false
    default: "true"
  repair-token:
    description: >
      Token for git push. When provided, enables a repair step that runs
      after check failures: uv sync, ruff check --fix, ruff format, then
      commit and push. Use a GitHub App token so the push triggers a new
      workflow run. The calling workflow must checkout with
      ref: ${{ github.head_ref }}.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      id: setup
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install UV
      uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
      with:
        version: ${{ inputs.uv-version }}

    - name: Load cached venv
      id: venv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: venv-${{ runner.os }}-${{ steps.setup.outputs.python-version }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup.outputs.python-version }}-${{ inputs.working-directory }}-

    - name: Sync dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen

    - name: Run ruff check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff check ${{ inputs.src-dirs }}

    - name: Run ruff format check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff format --check ${{ inputs.src-dirs }}

    - name: Run mypy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run mypy ${{ inputs.src-dirs }}

    - name: Run pytest
      if: inputs.run-pytest == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run pytest

    - name: Repair
      if: failure() && inputs.repair-token != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPAIR_TOKEN: ${{ inputs.repair-token }}
      run: |
        git config --global url."https://x-access-token:${REPAIR_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        uv sync
        uv run ruff check --fix ${{ inputs.src-dirs }} || true
        uv run ruff format ${{ inputs.src-dirs }}

        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "fix: auto-fix lint and formatting issues"
          git push
        fi

branding:
  icon: check-circle
  color: orange
