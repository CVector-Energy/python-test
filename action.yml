name: CVector Python Test
description: Setup UV and run ruff, mypy, and pytest for Python projects

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.14"
  uv-version:
    description: UV version to install
    required: false
    default: "0.10.2"
  src-dirs:
    description: Source directories for linting (space-separated)
    required: false
    default: "."
  working-directory:
    description: Directory containing pyproject.toml (defaults to repo root)
    required: false
    default: "."
  run-pytest:
    description: Whether to run pytest
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      id: setup
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install UV
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/${{ inputs.uv-version }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Load cached venv
      id: venv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: venv-${{ runner.os }}-${{ steps.setup.outputs.python-version }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup.outputs.python-version }}-${{ inputs.working-directory }}-

    - name: Sync dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen

    - name: Run ruff check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff check ${{ inputs.src-dirs }}

    - name: Run ruff format check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff format --check ${{ inputs.src-dirs }}

    - name: Run mypy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run mypy ${{ inputs.src-dirs }}

    - name: Run pytest
      if: inputs.run-pytest == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run pytest

branding:
  icon: check-circle
  color: orange
